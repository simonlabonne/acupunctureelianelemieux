---
layout: default
---

<h1>{{ page.title }}</h1>

{{ content }}

<h2>Articles à lire</h2>

{% assign list_articles = site.articles | sort:"position" %}
{% for article in list_articles %}
<div class="row mb-4">
  <div class="col-sm-3 mb-3 mb-sm-0">
    <a href="{{ article.link }}">
      <img src="{{ article.image }}">
    </a>
  </div>
  <div class="col-sm-9 mb-3 mb-sm-0">
    <h3>{{ article.title }}</h3>
    <!-- Bootstral <a> url button to open the link -->
    <a href="{{ article.link }}" class="btn btn-primary">Lire l'article</a>
  </div>
</div>

{% endfor %}
