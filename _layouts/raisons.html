---
layout: default
---

<h1>{{ page.title }}</h1>

<div class="row align-items-center justify-content-md-center">
  <div class="mb-3 mb-sm-0 col-sm-3 order-first order-sm-2">
    <img src="{{ page.image }}">
  </div>
  <div class="col-sm-8">
    {{ page.intro }}
  </div>
</div>

<br>

<div class="accordion" id="raisonsAccordion">
{% assign list_raisons = site.raisons | sort:'position' %}
{% for raison in list_raisons %}
  <div class="card">
    <div class="card-header" id="heading{{ raison.title | slugify }}">
      <h3 class="m-0">
        <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapse{{ raison.title | slugify }}" aria-expanded="true" aria-controls="collapse{{ raison.title | slugify }}">
          <i class="fa fa-chevron-down"></i> {{ raison.title }}
        </button>
      </h3>
    </div>
    <div id="collapse{{ raison.title | slugify }}" class="collapse" aria-labelledby="heading{{ raison.title | slugify }}" data-parent="#raisonsAccordion">
      <div class="card-body">
        {{ raison.content }}
      </div>
    </div>
  </div>
{% endfor %}
</div>


{{ content }}
