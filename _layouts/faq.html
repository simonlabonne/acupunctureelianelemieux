---
layout: default
---

<h1>{{ page.title }}</h1>

<img src="{{ page.image }}" style="float: right; padding: 0 2rem; width: 600px; top: 5px; position: relative;">

{{ page.intro }}
<br>

<div class="accordion" id="faqAccordion">
{% assign list_faq = site.faq | sort:"position" %}
{% for faq in list_faq %}
  <div class="card">
    <div class="card-header" id="heading{{ faq.title | slugify }}">
      <h3 class="m-0">
        <button class="btn btn-link btn-block text-left" type="button" data-toggle="collapse" data-target="#collapse{{ faq.title | slugify }}" aria-expanded="true" aria-controls="collapse{{ faq.title | slugify }}">
          <i class="fa fa-chevron-down"></i> {{ faq.title }}
        </button>
      </h3>
    </div>
    <div id="collapse{{ faq.title | slugify }}" class="collapse" aria-labelledby="heading{{ faq.title | slugify }}" data-parent="#faqAccordion">
      <div class="card-body">
        {{ faq.content }}
      </div>
    </div>
  </div>
{% endfor %}
</div>


{{ content }}
